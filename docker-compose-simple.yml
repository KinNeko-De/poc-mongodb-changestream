version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: poc-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    volumes:
      - mongodb_data:/data/db
    networks:
      - poc-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      
  mongodb-setup:
    image: mongo:7.0
    container_name: poc-mongodb-setup
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./docker/mongodb-init-replica.js:/scripts/mongodb-init-replica.js
      - ./docker/mongodb-init.js:/scripts/mongodb-init.js
    command: >
      bash -c "
        echo 'Running replica set initialization...' &&
        mongosh --host mongodb:27017 --file /scripts/mongodb-init-replica.js &&
        echo 'Running database initialization...' &&
        mongosh --host mongodb:27017 --file /scripts/mongodb-init.js
      "
    networks:
      - poc-network
    restart: "no"

volumes:
  mongodb_data:
    driver: local

networks:
  poc-network:
    driver: bridge
